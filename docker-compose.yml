version: "3.9"


services:
  memcached:
    image: memcached:latest
    container_name: memcached
    ports:
      - '11211:11211'


  redis:
    image: redis:latest
    container_name: redis
    ports:
      - '6379:6379'

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: training
      POSTGRES_USER: training_user
      POSTGRES_PASSWORD: training_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"


volumes:
  postgres_data: